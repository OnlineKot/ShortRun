<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>iCloud Shortcut Web Engine</title>
  <!-- Biblioteki do dekodowania binarnego formatu Apple (bplist) -->
  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bplist-parser@0.3.2/bplistParser.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    .box { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
    input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
    button { background: #0a84ff; border: none; color: #fff; font-weight: bold; padding: 12px 20px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #0071e3; }
    .badge { display: inline-block; background: #30d158; color: #000; font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; margin-bottom: 8px; }
    .action-card { background: #2c2c2e; border-left: 3px solid #0a84ff; border-radius: 6px; padding: 10px; margin-top: 8px; font-size: 13px; font-family: monospace; }
    pre { font-family: monospace; color: #30d158; margin: 0; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

<div class="container">
  <h2>⚡ iCloud Shortcut Web Simulator</h2>
  
  <div class="box">
    <label style="font-size: 13px; color: #8e8e93; display: block; margin-bottom: 8px;">Wklej link iCloud do Skrótu:</label>
    <input type="text" id="icloudUrl" placeholder="https://www.icloud.com/shortcuts/a1b2c3d4..." value="">
    
    <label style="font-size: 13px; color: #8e8e93; display: block; margin-bottom: 8px;">Dane wejściowe (Input dla skrótu):</label>
    <input type="text" id="userInput" placeholder="Wpisz opcjonalny tekst wejściowy...">

    <button onclick="loadAndRun()">Załaduj i uruchom Skrót</button>
  </div>

  <div class="box" id="outputBox" style="display: none; border-color: #30d158;">
    <div class="badge">Wyjście (Output)</div>
    <pre id="outputText">Inicjalizacja...</pre>
  </div>

  <div class="box" id="actionsBox" style="display: none;">
    <div style="font-weight: bold; margin-bottom: 10px;" id="shortcutTitle">Struktura Akcji</div>
    <div id="actionsList"></div>
  </div>
</div>

<script>
  // Konfiguracja bufora dla przeglądarki
  const Buffer = window.buffer.Buffer;

  async function loadAndRun() {
    const rawUrl = document.getElementById('icloudUrl').value.trim();
    const outputEl = document.getElementById('outputText');
    const outputBox = document.getElementById('outputBox');
    const actionsBox = document.getElementById('actionsBox');

    outputBox.style.display = 'block';
    outputEl.textContent = "Wyciąganie ID ze skrótu...";

    // 1. Walidacja i wyciągnięcie ID skrótu z adresu URL
    const match = rawUrl.match(/shortcuts\/([a-f0-9]{32})/i);
    if (!match) {
      outputEl.textContent = "Błąd: Wklej poprawny adres URL skrótu iCloud (powinien zawierać 32-znakowy identyfikator).";
      return;
    }

    const shortcutId = match[1];
    outputEl.textContent = `Pobieranie binarnego pliku skrótu (ID: ${shortcutId})...`;

    try {
      // 2. Pobieranie danych skrótu przez CORS Proxy z oficjalnego API Apple
      const apiUrl = `https://cvws.icloud-content.com/1/shortcut/${shortcutId}`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
      
      const res = await fetch(proxyUrl);
      const wrapperData = await res.json();
      
      if (!wrapperData.contents) {
        throw new Error("Nie udało się pobrać odpowiedzi z serwerów Apple.");
      }

      const appleJson = JSON.parse(wrapperData.contents);
      
      // Wyciągnięcie nazwy oraz zeskładowanych danych binarnego pliku plist
      const shortcutName = appleJson.fields?.name?.value || "Bez nazwy";
      const base64Data = appleJson.fields?.shortcut?.value?.data;

      if (!base64Data) {
        throw new Error("Skrót nie zawiera danych binarnego pliku .shortcut.");
      }

      outputEl.textContent = `Odszyfrowywanie struktury bplist skrótu "${shortcutName}"...`;

      // 3. Konwersja danych Base64 do bufora binarnego i dekodowanie bplist
      const fileBuffer = Buffer.from(base64Data, 'base64');
      const parsedPlist = bplistParser.parseBuffer(fileBuffer);
      
      const shortcutData = parsedPlist[0];
      const actions = shortcutData.WFWorkflowActions || [];

      document.getElementById('shortcutTitle').textContent = `Skrót: ${shortcutName} (${actions.length} akcji)`;
      actionsBox.style.display = 'block';

      renderActions(actions);
      executeShortcut(actions);

    } catch (err) {
      outputEl.textContent = "Błąd podczas dekodowania: " + err.message;
      console.error(err);
    }
  }

  function renderActions(actions) {
    const list = document.getElementById('actionsList');
    list.innerHTML = '';

    actions.forEach((act, i) => {
      const card = document.createElement('div');
      card.className = 'action-card';
      const type = (act.WFWorkflowActionIdentifier || '').replace('is.workflow.actions.', '');
      card.textContent = `${i + 1}. [${type}]`;
      list.appendChild(card);
    });
  }

  // 4. Silnik wykonujący wyciągnięte akcje bezpośrednio w przeglądarce
  async function executeShortcut(actions) {
    const outputEl = document.getElementById('outputText');
    let currentVariable = document.getElementById('userInput').value;

    outputEl.textContent = "== Uruchamianie skrótu na stronie ==\n";

    for (let i = 0; i < actions.length; i++) {
      const act = actions[i];
      const id = act.WFWorkflowActionIdentifier || '';
      const params = act.WFWorkflowActionParameters || {};

      outputEl.textContent += `\n[Krok ${i + 1}: ${id.split('.').pop()}]`;

      // Akcja: Tekst
      if (id.includes('text')) {
        currentVariable = params.WFTextActionText || currentVariable;
        outputEl.textContent += ` -> Zmienna: "${currentVariable}"`;
      }
      // Akcja: Podział tekstu
      else if (id.includes('splittext')) {
        const sep = params.WFTextSeparator || " ";
        currentVariable = currentVariable.split(sep);
        outputEl.textContent += ` -> Podzielono na tablicę: [${currentVariable.join(', ')}]`;
      }
      // Akcja: Otwórz URL
      else if (id.includes('openurl')) {
        const target = params.WFURL || currentVariable;
        outputEl.textContent += ` -> Otwieranie karty: ${target}`;
        window.open(target, '_blank');
      }
      // Inne akcje
      else {
        outputEl.textContent += ` -> Przetworzono akcję.`;
      }
    }

    outputEl.textContent += `\n\n=== KOŃCOWE WYJŚCIE (OUTPUT) ===\n`;
    outputEl.textContent += typeof currentVariable === 'object' ? JSON.stringify(currentVariable, null, 2) : currentVariable;
  }
</script>

</body>
</html>
